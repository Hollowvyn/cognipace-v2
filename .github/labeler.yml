'area: github':
  - changed-files:
      - any-glob-to-any-file:
          - '.github/**/*'

'area: docs':
  - changed-files:
      - any-glob-to-any-file:
          - '**/*.md'
          - 'docs/**/*'
          - 'design.md'
          - 'AGENTS.md'
          - 'CLAUDE.md'

