name: Release Please

on:
  schedule:
    - cron: '0 15 * * 5'
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    if: >-
      github.event_name != 'push' ||
      startsWith(github.event.head_commit.message, 'fix:') ||
      startsWith(github.event.head_commit.message, 'fix(') ||
      startsWith(github.event.head_commit.message, 'fix!') ||
      startsWith(github.event.head_commit.message, 'deps:') ||
      startsWith(github.event.head_commit.message, 'deps(') ||
      startsWith(github.event.head_commit.message, 'deps!') ||
      startsWith(github.event.head_commit.message, 'chore(main): release ')

    steps:
      - name: Run Release Please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Checkout release tag
        if: ${{ steps.release.outputs.release_created == 'true' }}
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.tag_name }}

      - name: Setup Node
        if: ${{ steps.release.outputs.release_created == 'true' }}
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        if: ${{ steps.release.outputs.release_created == 'true' }}
        run: npm ci

      - name: Run checks
        if: ${{ steps.release.outputs.release_created == 'true' }}
        run: npm run check

      - name: Build extension
        if: ${{ steps.release.outputs.release_created == 'true' }}
        run: npm run build

      - name: Zip extension
        if: ${{ steps.release.outputs.release_created == 'true' }}
        run: npm run zip

      - name: Prepare release asset
        if: ${{ steps.release.outputs.release_created == 'true' }}
        id: extension_asset
        shell: bash
        run: |
          zip_path="$(find .output -maxdepth 1 -type f -name '*.zip' | sort | tail -n 1)"
          if [[ -z "$zip_path" ]]; then
            echo "No WXT zip artifact found in .output" >&2
            exit 1
          fi

          asset_name="cognipace-${{ steps.release.outputs.version }}-chrome-mv3.zip"
          cp "$zip_path" "$asset_name"

          echo "path=$asset_name" >> "$GITHUB_OUTPUT"
          echo "name=$asset_name" >> "$GITHUB_OUTPUT"

      - name: Upload extension zip
        if: ${{ steps.release.outputs.release_created == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ steps.release.outputs.tag_name }}" \
            "${{ steps.extension_asset.outputs.path }}" \
            --clobber
