name: Release Please

on:
  schedule:
    - cron: '0 15 * * 5'
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    if: >-
      github.event_name != 'push' ||
      startsWith(github.event.head_commit.message, 'fix:') ||
      startsWith(github.event.head_commit.message, 'fix(') ||
      startsWith(github.event.head_commit.message, 'fix!') ||
      startsWith(github.event.head_commit.message, 'deps:') ||
      startsWith(github.event.head_commit.message, 'deps(') ||
      startsWith(github.event.head_commit.message, 'deps!') ||
      startsWith(github.event.head_commit.message, 'chore(main): release ')

    steps:
      - name: Run Release Please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Checkout release tag
        if: ${{ steps.release.outputs.release_created == 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.release.outputs.tag_name }}

      - name: Setup Node
        if: ${{ steps.release.outputs.release_created == 'true' }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install pinned npm
        if: ${{ steps.release.outputs.release_created == 'true' }}
        run: npm install --global npm@11.19.0

      - name: Show toolchain versions
        if: ${{ steps.release.outputs.release_created == 'true' }}
        run: |
          node --version
          npm --version

      - name: Install dependencies
        if: ${{ steps.release.outputs.release_created == 'true' }}
        run: npm ci

      - name: Run checks
        if: ${{ steps.release.outputs.release_created == 'true' }}
        run: npm run check

      - name: Build extension
        if: ${{ steps.release.outputs.release_created == 'true' }}
        run: npm run build

      - name: Zip extension
        if: ${{ steps.release.outputs.release_created == 'true' }}
        run: npm run zip

      - name: Prepare release asset
        if: ${{ steps.release.outputs.release_created == 'true' }}
        id: extension_asset
        shell: bash
        run: |
          zip_path="$(find dist -maxdepth 1 -type f -name '*.zip' | sort | tail -n 1)"
          if [[ -z "$zip_path" ]]; then
            echo "No WXT zip artifact found in dist" >&2
            exit 1
          fi

          asset_name="cognipace-${{ steps.release.outputs.version }}-chrome-mv3.zip"
          cp "$zip_path" "$asset_name"

          echo "path=$asset_name" >> "$GITHUB_OUTPUT"
          echo "name=$asset_name" >> "$GITHUB_OUTPUT"

      - name: Upload extension zip
        if: ${{ steps.release.outputs.release_created == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ steps.release.outputs.tag_name }}" \
            "${{ steps.extension_asset.outputs.path }}" \
            --clobber
